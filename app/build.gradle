plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.kapt)
}

// set flag whether we are on a build server
def isCi = "true" == System.getenv("CI")

android {
    namespace 'dynoapps.exchange_rates'
    compileSdk libs.versions.compileSdk.get().toInteger()

    signingConfigs {
        debug {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile file("${project.rootDir}/signing/debug.keystore")
            storePassword 'android'
        }
        release {
            def ciKeystore = file("${project.rootDir}/release.jks")
            if (isCi) {
                // CI writes release.jks from a secret before building. Without it the
                // production bundle is built unsigned instead of failing the build.
                if (ciKeystore.exists()) {
                    storeFile ciKeystore
                    storePassword System.getenv("RELEASE_STORE_PASSWORD")
                    keyAlias System.getenv("RELEASE_ALIAS")
                    keyPassword System.getenv("RELEASE_PASSWORD")
                } else {
                    println 'release.jks is missing; production build will be unsigned'
                }
            } else {
                Properties propsSigning = new Properties()
                def signingPropsFile = rootProject.file("signing/release.signing.properties")
                if (signingPropsFile.canRead()) {
                    signingPropsFile.withInputStream { propsSigning.load(it) }
                    if (propsSigning.containsKey('STORE_FILE') &&
                            propsSigning.containsKey('STORE_PASSWORD') &&
                            propsSigning.containsKey('KEY_ALIAS') &&
                            propsSigning.containsKey('KEY_PASSWORD')) {
                        storeFile file(propsSigning['STORE_FILE'])
                        storePassword propsSigning['STORE_PASSWORD']
                        keyAlias propsSigning['KEY_ALIAS']
                        keyPassword propsSigning['KEY_PASSWORD']
                    } else {
                        println 'release.signing.properties file found but some entries are missing'
                    }
                } else {
                    println 'release.signing.properties file is missing'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt',
                         'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/*.version',
                         'META-INF/proguard/*', '/*.properties', 'META-INF/*.properties']
        }
    }

    defaultConfig {
        applicationId "dynoapps.exchange_rates"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode getBuildVersionCode()
        versionName getBuildVersionName()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            versionNameSuffix ' Debug'
            applicationIdSuffix '.debug'
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        production {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-android-java.pro'
            signingConfig = (signingConfigs.release.storeFile != null) ? signingConfigs.release : null
            minifyEnabled true
            shrinkResources true
        }
    }

    bundle {
        density {
            enableSplit true
        }
        abi {
            enableSplit true
        }
        language {
            enableSplit true
        }
    }

    lint {
        checkDependencies true
        checkReleaseBuilds false
        disable += ['StringFormatMatches', 'Instantiatable']
        ignoreTestSources true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

kapt {
