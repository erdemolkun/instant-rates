name: Android CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        # Reported but not yet blocking; make it blocking once the existing warnings are triaged.
        continue-on-error: true
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Write release keystore
        if: github.event_name == 'push'
        env:
          RELEASE_PATH_ENCODED: ${{ secrets.RELEASE_PATH_ENCODED }}
        run: |
          if [ -n "$RELEASE_PATH_ENCODED" ]; then
            echo "$RELEASE_PATH_ENCODED" | base64 -d > release.jks
          fi

      - name: Build production bundle
        if: github.event_name == 'push'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_ALIAS: ${{ secrets.RELEASE_ALIAS }}
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
        run: ./gradlew bundleProduction

      - name: Upload app bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: app/build/outputs/bundle/production/*.aab
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
